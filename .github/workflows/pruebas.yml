# Corre en cada PR hacia main y en cada push a main. Si falla, el PR queda
# en rojo antes de fusionar (el servidor ademas repite las pruebas antes de
# desplegar: scripts/autodeploy.sh). No usa base de datos ni shares: las
# pruebas del backend no los necesitan, asi que no hay secretos aqui.
name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Correr pruebas
        env:
          APP_ENV: local
        run: python -m unittest discover -s app/services/tests -p "test_*.py" -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
