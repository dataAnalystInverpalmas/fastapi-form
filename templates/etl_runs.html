{% extends "base.html" %}
{% block page_title %}<i class="fas fa-clock-rotate-left me-2"></i>Historial ETL{% endblock %}
{% block content %}
<section class="mt-4" data-page-type="runs">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="mb-0"><i class="fas fa-list-check me-2"></i>Historial de ejecuciones</h4>
        <div class="d-flex gap-2">
            <button id="btn-refresh" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-rotate me-1"></i>Actualizar ahora
            </button>
            <a class="btn btn-outline-secondary btn-sm" href="/etl/jobs">
                <i class="fas fa-arrow-left me-1"></i>Volver a jobs
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-light border-bottom d-flex justify-content-between align-items-center">
            <strong>Últimas 100 ejecuciones</strong>
            <span class="badge bg-secondary" id="poll-indicator">
                <i class="fas fa-satellite-dish me-1"></i><span id="poll-countdown">–</span>
            </span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped mb-0" id="runsTable">
                    <thead class="table-light">
                        <tr>
                            <th>Run ID</th>
                            <th>Job</th>
                            <th>Estado</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Duración (s)</th>
                            <th>Salida</th>
                            <th>Error</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

</section>
{% endblock %}
